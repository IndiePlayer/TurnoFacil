services:
  - type: web
    name: turno-facil
    runtime: node
    plan: starter
    buildCommand: npm ci && npm --prefix frontend ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/businesses
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/turnofacil.db
    disk:
      name: turno-facil-data
      mountPath: /var/data
      sizeGB: 1
